name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The test suite runs with no network, no Docker, no API key and no GPU,
      # so only the dev extra is installed. The SWE-bench and attacker extras
      # (swebench, datasets, anthropic, boto3) are not needed to check the
      # metric code or to recompute the published numbers from results/.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      # Guards the README's "results: reproducible" badge: the published
      # headline must still fall out of the committed records.
      - name: Recompute the published headline from results/
        # --check exits 1 if any README figure stops recomputing. Without it this
        # step always passed and guarded nothing.
        run: |
          python harness/swe_native_rate.py
          python harness/swe_confirm.py --check
